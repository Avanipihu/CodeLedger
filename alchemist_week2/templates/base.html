<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureDep{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top"><a href="{{ url_for('index') }}" class="brand">SecureDep</a>
    <span class="tag">Known vulnerabilities in your pinned dependencies</span></header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}<ul class="notes">
        {% for cat, m in msgs %}<li class="note {{ cat }}">{{ m }}</li>{% endfor %}
      </ul>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
