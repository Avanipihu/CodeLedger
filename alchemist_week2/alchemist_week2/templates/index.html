{% extends "base.html" %}
{% block content %}
<h1>Scan a dependency file</h1>
<p class="lede">Upload a pinned <code>requirements.txt</code> (or <code>pip freeze</code> output). Each line must look like <code>name==version</code>.</p>
<form method="post" action="{{ url_for('scan') }}" enctype="multipart/form-data" class="upload">
  <label>Project name
    <input type="text" name="project_name" value="{{ project or '' }}" maxlength="100" required>
  </label>
  <label>Dependency file
    <input type="file" name="requirements" accept=".txt,text/plain" required>
  </label>
  <button type="submit">Scan dependencies</button>
</form>
{% endblock %}
