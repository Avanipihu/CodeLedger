<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CodeLedger{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('projects') }}">CodeLedger</a>
  <a class="nav" href="{{ url_for('projects') }}">Projects</a>
  <a class="nav" href="{{ url_for('new_project') }}">Import dependencies</a>
  <a class="nav" href="{{ url_for('explorer') }}">Vulnerability explorer</a>
  <a class="nav" href="{{ url_for('status') }}">Data status</a>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
